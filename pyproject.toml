[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "skill-graphs"
version = "2.2.0"
description = "A collection of skill graphs for AI agents"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = ["scion-sdk[mcp]>=0.11.2,<0.12"]

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "build>=1.5.0"
]

# Content is found by convention under the package (`skill_graphs/skills/<name>/SKILL.md`);
# the one declaration below is a content-only connector (SCION-CONNECTOR-CONTROL-R071.1).
[project.entry-points."scion_sdk.connector"]
skill-graphs = "skill_graphs"

[[project.authors]]
name = "Meristem Contributors"
email = "maintainers@example.com"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
skill_graphs = [ "**/*", "**/.*.md" ]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "skill_graphs*",]

[tool.pytest.ini_options]
# The catalog is content only: it serves skills, not tools, so the connector conformance plugin has nothing to check.
addopts = "-p no:scion_sdk"
markers = [
    "slow: exercises a heavy operation (e.g. building the wheel); excluded from the default pre-commit run via -m 'not slow'",
]
