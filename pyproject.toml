[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "skill-graphs"
version = "2.0.0"
description = "A collection of skill graphs for AI agents"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3",]
requires-python = ">=3.11, <3.15"
dependencies = [ ]

[project.optional-dependencies]
test = [
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "build>=1.5.0"
]

[[project.authors]]
name = "Agent Utilities Contributors"
email = "maintainers@example.com"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
skill_graphs = [ "**/*" ]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a heavy operation (e.g. building the wheel); excluded from the default pre-commit run via -m 'not slow'",
]
