name: docassemble
description: Legal document automation and interview platform
category: legal
version: "1.5"
concept: ECO-4.14
requires:
  memory_mb: 1024
  cpu_cores: 1.0
  gpu: false
dns_rewrite: legal.knuckles.team
mcp_server: null
serves_departments:
  - legal
stack_file: |
  version: "3.8"
  services:
    docassemble:
      image: jhpyle/docassemble:latest
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - da-data:/usr/share/docassemble/backup
      environment:
        - DAHOSTNAME=legal.knuckles.team
        - DABACKUPDAYS=14
        - TIMEZONE=America/New_York
  volumes:
    da-data:
