name: emerald-exchange
description: Unified Finance MCP with multi-exchange backend abstraction and risk guards
category: trading
version: "0.1.0"
concept: EE-001
requires:
  memory_mb: 1024
  cpu_cores: 1.0
  gpu: false
dns_rewrite: trading.knuckles.team
mcp_server: emerald-exchange
serves_departments:
  - finance
  - trading
stack_file: |
  version: "3.8"
  services:
    emerald-exchange:
      image: emerald-exchange:latest
      build:
        context: .
        dockerfile: docker/Dockerfile
      restart: unless-stopped
      ports:
        - "9020:9000"
      environment:
        - DEFAULT_AGENT_NAME=Emerald Exchange
        - AGENT_DESCRIPTION=Unified Finance MCP
        - LLM_BASE_URL=${LLM_BASE_URL:-http://10.0.0.18:1234/v1}
      volumes:
        - config:/root/.config/agent-utilities
        - secrets:/root/.config/agent-utilities/secrets
      healthcheck:
        test: ["CMD", "python", "-c", "import emerald_exchange; print('ok')"]
        interval: 30s
        timeout: 10s
        retries: 3
      deploy:
        resources:
          limits:
            memory: 1024M
            cpus: "1.0"
  volumes:
    config:
    secrets:
