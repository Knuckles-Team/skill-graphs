# Without this, `pre-commit install` wires ONLY the pre-commit hook, so `git push`
# runs nothing and every hook staged pre-push is silently dead code.
default_install_hook_types: [pre-commit, pre-push]
exclude:
  ^(scripts/|.*skill_graphs/|.*pnpm-lock\.yaml|.*uv\.lock|.*\.db$|.*\.bak$|.*\.sqlite$)
# Phase 0 dev-velocity contract (graph-os-completion-program): a hook with no
# explicit `stages:` below is commit-only, never both.
default_stages: [pre-commit]
default_language_version:
  # Exact LTS: nodeenv cannot parse alpha entries (27.0.0-alpha) when resolving "latest".
  node: 24.22.2
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$|.*\.db$|.*\.bak$|.*\.sqlite$
  - id: check-ast
    exclude: ^(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
  hooks:
  - id: ruff-check
    args: ["--fix", "--ignore=E402"]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-format
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518]
    args: ["--ignore-missing-imports"]
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,", "--ignore-words=.codespellignore"]
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B404,B603"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]
- repo: local
  hooks:
  - id: uv-lock
    name: uv-lock (verify, never mutate)
    entry: uv lock --check
    language: system
    files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
    pass_filenames: false
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: mermaid-validate
    name: mermaid-validate
    entry: mermaid-validate
    language: node
    additional_dependencies: ['@zabaca/mermaid-validate@1.0.1']
    types: [markdown]
    pass_filenames: true
  - id: check-agent-standards
    name: check agent standards
    entry: |-
      bash -c 'for f in $(find . -type f -name "agent_server.py" -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do grep -q "warnings.filterwarnings" "$f" && grep -q "file=sys.stderr" "$f" || { echo "Missing warnings.filterwarnings or file=sys.stderr in $f"; exit 1; }; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-cli-help
    name: check cli help
    entry: |-
      bash -c 'for f in $(find . -type f \( -name "mcp_server.py" -o -name "agent_server.py" \) -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do mod=$(echo "$f" | sed -e "s/^\.\///" -e "s/\.py$//" -e "s/\//./g"); uv run python -m "$mod" --help >/dev/null || exit 1; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi'
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: pytest
    name: pytest
    entry: uv run --all-extras pytest tests -q --tb=short -m "not slow" --timeout=60
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
  - id: validate-skill-graphs
    name: Skill-graph contract gate
    entry: python scripts/validate_skill_graphs.py
    language: python
    pass_filenames: false
    always_run: true
  - id: check-path-portability
    name: Cross-platform path portability gate
    entry: python scripts/check_path_portability.py skill_graphs --max-path 140 --max-name 100 --max-violations 0
    language: python
    pass_filenames: false
    always_run: true
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main # sanctioned first-party exception; never SHA-pinned
  hooks:
  - id: no-legacy-concepts
  - id: dependency-readiness
    additional_dependencies:
    - repository-manager @ git+https://github.com/Knuckles-Team/repository-manager.git@dd963af6246f59fcf837ac2624898cd3079ccc6b
